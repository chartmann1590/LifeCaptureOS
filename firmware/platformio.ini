[platformio]
src_dir = main

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = espidf

; Serial monitor
monitor_speed = 115200
monitor_port = COM9
upload_port = COM9
upload_speed = 921600

; Build flags - PSRAM disabled due to detection issues
build_flags =
    ; -DBOARD_HAS_PSRAM
    ; -mfix-esp32-psram-cache-issue

board_build.partitions = huge_app.csv
